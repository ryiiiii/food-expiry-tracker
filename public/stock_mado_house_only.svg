<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- 背景：アプリのテーマカラー #2E6B4E -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- 家ロゴのみ：中央寄せ・少し拡大 -->
  <g transform="translate(256 256) scale(1.12) translate(-256 -220)">
  <!-- 家ロゴ：手書き風の揺らぎフィルターを適用 -->
  <g filter="url(#rough)">
  <!-- 家（屋根＋本体）：アプリの背景色 #F6F6F3 -->
  <polygon points="256,86 424,226 88,226" fill="#2E6B4E" stroke="#2E6B4E" stroke-width="16" stroke-linejoin="round"/>
  <rect x="150" y="226" width="212" height="136" rx="16" fill="#2E6B4E"/>

  <!-- 上段の缶詰（在庫・期限）：アプリの色 -->
  <rect x="173" y="246" width="34" height="44" rx="6" fill="#F6F6F3"/>
  <rect x="217" y="246" width="34" height="44" rx="6" fill="#A9C6B7"/>
  <rect x="261" y="246" width="34" height="44" rx="6" fill="#E0A23A"/>
  <rect x="305" y="246" width="34" height="44" rx="6" fill="#A9C6B7"/>
  <rect x="173" y="256" width="34" height="10" fill="#2E6B4E" opacity="0.5"/>
  <rect x="217" y="256" width="34" height="10" fill="#2E6B4E" opacity="0.5"/>
  <rect x="261" y="256" width="34" height="10" fill="#2E6B4E" opacity="0.5"/>
  <rect x="305" y="256" width="34" height="10" fill="#2E6B4E" opacity="0.5"/>

  <!-- 棚板1 -->
  <rect x="162" y="290" width="188" height="8" rx="4" fill="#F6F6F3"/>

  <!-- 下段（びん・袋）：注意色のアンバーも含む -->
  <rect x="173" y="304" width="34" height="34" rx="10" fill="#E0A23A"/>
  <rect x="217" y="304" width="34" height="34" rx="10" fill="#5F6661"/>
  <rect x="261" y="304" width="34" height="34" rx="10" fill="#A9C6B7"/>
  <rect x="305" y="304" width="34" height="34" rx="10" fill="#F6F6F3"/>

  <!-- 棚板2 -->
  <rect x="162" y="344" width="188" height="8" rx="4" fill="#F6F6F3"/>

  </g>
  </g>
</svg>
